# A reasonably hardened self-hosted Git service: Caddy (TLS reverse proxy),
# Gitea (rootless image) and PostgreSQL.
#
# Secrets are read from files in ./secrets (not committed) and passed with
# Docker secrets; nothing sensitive is stored in this file. Pin image digests
# (image: name:tag@sha256:...) for fully reproducible deployments; StackSentry
# reports their absence as low-severity SST-OPS-006 findings.
name: git-stack

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}
    logging: *logging

  gitea:
    image: gitea/gitea:1.22.3-rootless
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/secrets/db_password
      GITEA__server__ROOT_URL: https://${GIT_DOMAIN:-git.example.com}/
    secrets: [db_password]
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    tmpfs: [/tmp]
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging: *logging

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs: [/tmp, /run/postgresql]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 1m
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging: *logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  gitea-data:
  gitea-config:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
