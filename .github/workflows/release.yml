name: Release

# Runs when a v* tag is pushed, or when a release is published in the GitHub
# UI (which creates the tag). Both paths end with the same release: if it
# already exists, the binaries and checksums are attached to it.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Build binaries and checksums
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Smoke test
        run: |
          ./dist/stacksentry-${GITHUB_REF_NAME}-linux-amd64 version
          ./dist/stacksentry-${GITHUB_REF_NAME}-linux-amd64 scan compose examples/reasonably-secure-compose.yaml --fail-on medium
          (cd dist && sha256sum --check checksums.txt)
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            prerelease=""
            case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "StackSentry ${GITHUB_REF_NAME}" \
              --generate-notes \
              ${prerelease}
          fi
