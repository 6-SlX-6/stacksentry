name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Build binaries and checksums
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Smoke test
        run: |
          ./dist/stacksentry-${GITHUB_REF_NAME}-linux-amd64 version
          ./dist/stacksentry-${GITHUB_REF_NAME}-linux-amd64 scan compose examples/reasonably-secure-compose.yaml --fail-on medium
          (cd dist && sha256sum --check checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "StackSentry ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
