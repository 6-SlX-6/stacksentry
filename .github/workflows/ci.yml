name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check formatting (gofmt)
        run: make fmt-check
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Build golangci-lint with the job's Go toolchain so that it always
          # understands the Go version under test.
          install-mode: goinstall

  vulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: oldstable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Coverage (minimum 80% for engine, report, findings and rules)
        run: make coverage
      - name: HTML report
        run: go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "dist/stacksentry-${GOOS}-${GOARCH}${ext}" ./cmd/stacksentry
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: stacksentry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg VERSION=0.1.0 --build-arg "COMMIT=${GITHUB_SHA::12}" -t stacksentry:ci .
      - name: Run image against an example stack
        run: |
          docker run --rm stacksentry:ci version
          docker run --rm -v "$PWD/examples:/work:ro" stacksentry:ci \
            scan compose /work/reasonably-secure-compose.yaml --fail-on medium
          set +e
          docker run --rm -v "$PWD/examples:/work:ro" stacksentry:ci \
            scan compose /work/insecure-compose.yaml --fail-on high --quiet
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi

  examples:
    name: Example commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Verify documented commands against fixtures
        # GitHub-hosted Ubuntu runners include Docker, so this also exercises
        # a real, read-only `scan host`.
        run: make verify-examples
      - name: Check that generated docs and golden files are up to date
        run: |
          make docs golden
          git diff --exit-code -- docs/rules.md testdata/expected examples/reports
