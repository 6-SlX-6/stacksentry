# Linux capability cases.
services:
  dangerous:
    image: example/net-tool:1.0.0
    cap_add: [NET_ADMIN, SYS_PTRACE, CAP_SYS_MODULE]
  harmless:
    image: example/web:1.0.0
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
  partial-drop:
    image: example/web:1.0.0
    cap_drop: [NET_RAW, MKNOD]
  everything:
    image: example/debug:1.0.0
    cap_add: [ALL]
