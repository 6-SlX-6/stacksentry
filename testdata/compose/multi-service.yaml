# Several services with distinct tiers on a single default network.
name: shop
services:
  frontend:
    image: nginx:1.27.2
    restart: unless-stopped
    ports:
      - "80:80"
  api:
    image: ghcr.io/example/shop-api:4.1.0
    restart: unless-stopped
    depends_on: [db, cache]
  worker:
    image: ghcr.io/example/shop-api:4.1.0
    command: ["worker"]
    restart: unless-stopped
  db:
    image: mariadb:11.4
    restart: unless-stopped
    volumes:
      - dbdata:/var/lib/mysql
  cache:
    image: valkey/valkey:8.0
    restart: unless-stopped
  debug:
    image: busybox:1.36
    profiles: [debug]
    command: ["sleep", "infinity"]
volumes:
  dbdata:
