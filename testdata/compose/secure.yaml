# Hardened stack: every StackSentry rule should pass.
name: secure-stack

services:
  proxy:
    image: nginx:1.27.2-alpine@sha256:2140dad235c130ac861018a4e13a6bc8aea3a35f3a40e20c1b060d51a7efd250
    user: "101:101"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}
    logging:
      driver: local

  db:
    image: postgres:16.4@sha256:91f464e7ba0ad91a106c94cff079fb4384139291b8c0502fd36989cf2c788bbb
    user: "999:999"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    stop_grace_period: 1m
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs: [/tmp, /run/postgresql]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
    deploy:
      resources:
        limits: {memory: 1G, cpus: "1.0"}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
